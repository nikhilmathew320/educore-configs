server:
  port: 8080

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: identity-service
          uri: lb://identity-service
          predicates:
            - Path=/auth/**
        - id: student-service
          uri: lb://student-service
          predicates:
            - Path=/api/v1/students/**

        - id: school-service
          uri: lb://school-service
          predicates:
            - Path=/api/v1/schools/**