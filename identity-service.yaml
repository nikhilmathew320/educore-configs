server:
  port: 9898

spring:
  datasource:
    url: ${IDENTITY_DB_URL}
    username: ${IDENTITY_DB_USER}
    password: ${IDENTITY_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: app
        format_sql: true
        show_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/master-changelog.yaml
    default-schema: app
    liquibase-schema: liquibase

application:
  security:
    jwt:
      secret-key: ${IDENTITY_SECRET_KEY}
      expiration: 3600000
      refresh-token:
        expiration: 86400000

logging:
  level:
    root: INFO
    com.educore: INFO