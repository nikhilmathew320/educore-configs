server:
  port: 8090

spring:
  datasource:
    url: ${STUDENT_DB_URL}
    username: ${STUDENT_DB_USER}
    password: ${STUDENT_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: app
        format_sql: true
        show_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/master-changelog.yaml
    default-schema: app
    liquibase-schema: liquibase

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true
        spring.json.type.mapping: "student:com.educore.studentservice.event.StudentCreatedEvent"

logging:
  level:
    root: INFO